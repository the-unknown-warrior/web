<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>App icon: a framed mountain landscape split by a slanted line, daytime on the left and nighttime on the right</title>
<desc>A rounded square app icon showing a large square wooden picture frame centered on a background split by a slanted diagonal. Inside the frame is a mountain landscape: the left half is a daytime scene with a blue sky, sun and green mountains, and the right half is the same mountain range at night with a dark sky, stars, moon and silhouetted peaks.</desc>

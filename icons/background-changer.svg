<stop offset="0" stop-color="#FDF6E9"/>
<stop offset="1" stop-color="#F3D9A8"/>
</linearGradient>
<linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1B1035"/>
<stop offset="1" stop-color="#05060D"/>
</linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8B5A2B"/>
<stop offset="0.5" stop-color="#6B3F1D"/>
<stop offset="1" stop-color="#4E2C12"/>
</linearGradient>
<linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#5FB4E0"/>
<stop offset="1" stop-color="#DCEFFB"/>
</linearGradient>
<linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0B1026"/>
<stop offset="1" stop-color="#1B2550"/>
</linearGradient>
